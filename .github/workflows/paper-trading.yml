name: 90-day paper trading worker
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
concurrency:
  group: trading-intelligence-paper-worker
  cancel-in-progress: false
jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run one scheduled paper-trading cycle
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAPER_SCAN_BATCH_SIZE: "10"
        run: node scripts/paper-worker.js
