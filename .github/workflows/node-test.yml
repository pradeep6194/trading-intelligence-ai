name: Node tests
on:
  push:
    branches: [main, feature/options-chain-paper-trading, feature/adaptive-market-learning, feature/integrated-ten-intelligence]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js && node --check scripts/paper-worker.js
      - run: npm test
